apiVersion: v1
kind: ConfigMap
metadata:
  name: commerce-coach-config
  namespace: commerce-coach
data:
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "4010"
  APP_ORIGINS: https://COACH_DOMAIN_PLACEHOLDER
  GOOGLE_REDIRECT_URI: "GOOGLE_REDIRECT_URI_PLACEHOLDER"
  TRUSTED_PROXIES: TRUSTED_PROXIES_PLACEHOLDER
  STARTUP_DATABASE_TIMEOUT_MS: "120000"
  NODE_OPTIONS: --enable-source-maps --max-old-space-size=896
  TMPDIR: /tmp
  DATABASE_URL_FILE: /run/secrets/database/database-url
  AUTH_DATABASE_URL_FILE: /run/secrets/database/auth-database-url
  OPENROUTER_API_KEY_FILE: /run/secrets/providers/openrouter-api-key
  GEMINI_API_KEY_FILE: /run/secrets/providers/gemini-api-key
  GOOGLE_CLIENT_ID_FILE: /run/secrets/providers/google-client-id
  GOOGLE_CLIENT_SECRET_FILE: /run/secrets/providers/google-client-secret
